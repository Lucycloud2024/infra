repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
  - repo: local
    hooks:
      - id: block-tfplan
        name: Block Terraform plan and state files
        entry: Plan and state files can contain secrets and must not be committed
        language: fail
        files: '(^|/)(tfplan|.*\.tfplan|.*\.tfstate.*)$'
